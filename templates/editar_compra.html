<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Editar compra</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f4f6f9,
                    #e9f5ee
                );

            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1a523c !important;
        }

        .edit-card {
            border: none;
            border-radius: 22px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .form-control {
            padding: 13px;
            border-radius: 12px;
        }

        .form-label {
            color: #1a523c;
            font-weight: bold;
        }

        .save-button {
            padding: 13px;

            border: none;
            border-radius: 13px;

            background: #1a523c;
            color: white;

            font-weight: bold;
        }

        .current-evidence {
            overflow: hidden;

            border-radius: 16px;
            background: #eef4f1;
        }

        .current-evidence img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
        }

        .current-evidence a {
            display: block;
            padding: 16px;

            color: #1a523c;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark px-3 py-3">

        <span class="navbar-brand fw-bold">

            <i class="bi bi-pencil-square"></i>
            Editar compra

        </span>

        <a
            href="{{ url_for(
                'historial_dia',
                fecha=compra.fecha.isoformat()
            ) }}"
            class="btn btn-light btn-sm"
        >
            <i class="bi bi-arrow-left"></i>
            Volver
        </a>

    </nav>

    <main
        class="container mt-4 mb-5"
        style="max-width:620px;"
    >

        <section class="card edit-card p-4">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="mb-3">

                    <label class="form-label">
                        Producto
                    </label>

                    <input
                        type="text"
                        name="producto"
                        class="form-control"
                        value="{{ compra.producto }}"
                        maxlength="255"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Proveedor
                    </label>

                    <input
                        type="text"
                        name="proveedor"
                        class="form-control"
                        value="{{ compra.proveedor }}"
                        maxlength="255"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Nombre del cliente
                    </label>

                    <input
                        type="text"
                        name="cliente"
                        class="form-control"
                        value="{{ compra.cliente or '' }}"
                        placeholder="Vacío significa compra propia"
                        maxlength="255"
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Monto
                    </label>

                    <input
                        type="number"
                        name="monto"
                        class="form-control"
                        value="{{ compra.monto }}"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Fecha
                    </label>

                    <input
                        type="date"
                        name="fecha"
                        class="form-control"
                        value="{{ compra.fecha.isoformat() }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Evidencia actual
                    </label>

                    <div class="current-evidence">

                        {% set extension =
                            compra.evidencia
                            .rsplit(".", 1)[-1]
                            |lower
                        %}

                        {% if extension in [
                            "jpg",
                            "jpeg",
                            "png",
                            "webp"
                        ] %}

                            <img
                                src="{{ url_for(
                                    'mostrar_archivo',
                                    nombre_archivo=compra.evidencia
                                ) }}"
                                alt="Evidencia actual"
                            >

                        {% else %}

                            <a
                                href="{{ url_for(
                                    'mostrar_archivo',
                                    nombre_archivo=compra.evidencia
                                ) }}"
                                target="_blank"
                            >
                                <i class="bi bi-file-earmark-pdf"></i>
                                Abrir PDF actual
                            </a>

                        {% endif %}

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Cambiar evidencia

                        <span class="text-muted fw-normal">
                            (opcional)
                        </span>
                    </label>

                    <input
                        type="file"
                        name="foto"
                        class="form-control"
                        accept="image/jpeg,image/png,image/webp,application/pdf"
                    >

                    <div class="form-text">
                        Déjalo vacío para conservar
                        la evidencia actual.
                    </div>

                </div>

                <button
                    type="submit"
                    class="save-button w-100"
                >
                    <i class="bi bi-check-circle"></i>
                    Guardar cambios
                </button>

            </form>

        </section>

    </main>

</body>
</html>
