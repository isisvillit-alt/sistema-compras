<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Meses</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='historial.css'
        ) }}"
    >
</head>

<body>

    <header class="top-header">

        <div class="header-icon">
            <i class="fa-solid fa-folder-tree"></i>
        </div>

        <h1>Todas las compras</h1>

        <p>
            Selecciona un mes
        </p>

    </header>

    <main class="page">

        <nav class="toolbar">

            <a
                href="{{ url_for('historial') }}"
                class="back-button"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Volver
            </a>

            <a
                href="{{ url_for('compras') }}"
                class="new-button"
            >
                <i class="fa-solid fa-plus"></i>
                Nueva compra
            </a>

        </nav>

        {% if meses %}

            <section class="folder-list">

                {% for mes in meses %}

                    <a
                        href="{{ url_for(
                            'historial_mes',
                            clave_mes=mes.clave
                        ) }}"
                        class="folder-link"
                    >

                        <div class="folder-left">

                            <i
                                class="fa-solid fa-folder
                                folder-icon"
                            ></i>

                            <div>

                                <span class="folder-title">
                                    {{ mes.nombre }}
                                </span>

                                <span class="folder-detail">
                                    {{ mes.cantidad }}

                                    {% if mes.cantidad == 1 %}
                                        compra
                                    {% else %}
                                        compras
                                    {% endif %}
                                </span>

                            </div>

                        </div>

                        <span class="folder-total">
                            ${{ "%.2f"|format(
                                mes.total|float
                            ) }}
                        </span>

                    </a>

                {% endfor %}

            </section>

        {% else %}

            <section class="empty">

                <i class="fa-solid fa-folder-open"></i>

                <h2>No hay meses disponibles</h2>

            </section>

        {% endif %}

    </main>

</body>
</html>
