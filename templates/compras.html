<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <meta
        name="theme-color"
        content="#1a523c"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Registrar compra</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        :root {
            --bs-success: #1a523c;
            --bs-success-rgb: 26, 82, 60;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #f4f6f9,
                    #e9f5ee
                );
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1a523c !important;
        }

        .form-card {
            border: none;
            border-radius: 22px;
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            color: #1a523c;
            font-weight: bold;
        }

        .form-control {
            padding: 13px;
            border-radius: 12px;
        }

        .helper {
            margin-top: 7px;
            color: #6c757d;
            font-size: 13px;
        }

        .btn-success {
            padding: 13px;
            border-color: #1a523c !important;
            border-radius: 13px;
            background: #1a523c !important;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark px-3 py-3">

        <span class="navbar-brand fw-bold">
            <i class="bi bi-cart-check"></i>
            Registrar compra
        </span>

        <div class="d-flex gap-2">

            <a
                href="{{ url_for('historial') }}"
                class="btn btn-light btn-sm"
            >
                <i class="bi bi-clock-history"></i>
                Historial
            </a>

            <a
                href="{{ url_for('salir') }}"
                class="btn btn-outline-light btn-sm"
            >
                <i class="bi bi-box-arrow-right"></i>
                Salir
            </a>

        </div>

    </nav>

    <main
        class="container mt-4 mb-5"
        style="max-width:620px;"
    >

        <section class="card form-card p-4">

            <h5 class="mb-4 text-center text-success">
                <i class="bi bi-plus-circle"></i>
                Nueva compra
            </h5>

            <form
                action="{{ url_for('guardar') }}"
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="mb-3">

                    <label
                        for="producto"
                        class="form-label"
                    >
                        Producto
                    </label>

                    <input
                        id="producto"
                        class="form-control"
                        type="text"
                        name="producto"
                        placeholder="Ej. Tomate, Manzana..."
                        maxlength="255"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="proveedor"
                        class="form-label"
                    >
                        Proveedor
                    </label>

                    <input
                        id="proveedor"
                        class="form-control"
                        type="text"
                        name="proveedor"
                        placeholder="Nombre del proveedor"
                        maxlength="255"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="cliente"
                        class="form-label"
                    >
                        Nombre del cliente

                        <span class="text-muted fw-normal">
                            (opcional)
                        </span>
                    </label>

                    <input
                        id="cliente"
                        class="form-control"
                        type="text"
                        name="cliente"
                        placeholder="Vacío si es una compra propia"
                        maxlength="255"
                        autocomplete="off"
                    >

                    <div class="helper">
                        Al dejarlo vacío aparecerá
                        “Compra propia”.
                    </div>

                </div>

                <div class="mb-3">

                    <label
                        for="monto"
                        class="form-label"
                    >
                        Monto
                    </label>

                    <input
                        id="monto"
                        class="form-control"
                        type="number"
                        name="monto"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="fecha"
                        class="form-label"
                    >
                        Fecha
                    </label>

                    <input
                        id="fecha"
                        class="form-control"
                        type="date"
                        name="fecha"
                        value="{{ fecha_hoy }}"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label
                        for="foto"
                        class="form-label"
                    >
                        Evidencia
                    </label>

                    <input
                        id="foto"
                        class="form-control"
                        type="file"
                        name="foto"
                        accept="image/jpeg,image/png,image/webp,application/pdf"
                        required
                    >

                    <div class="helper">
                        JPG, PNG, WEBP o PDF.
                        Máximo 10 MB.
                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    <i class="bi bi-check-circle"></i>
                    Guardar compra
                </button>

            </form>

        </section>

    </main>

</body>
</html>
