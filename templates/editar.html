<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Editar Compra</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
    background:#f2f4f7;
    font-family:Arial,sans-serif;
    margin:0;
    padding:0;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#1a523c,#198754);
    color:white;
    padding:22px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    border-bottom-left-radius:25px;
    border-bottom-right-radius:25px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

/* CONTENEDOR */
.container-edit{
    padding:15px;
    margin-top:15px;
}

/* CARD */
.card-edit{
    background:white;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    margin-bottom:30px;
}

/* IMAGEN */
.card-edit img{
    width:100%;
    height:300px;
    object-fit:cover;
}

/* CONTENIDO */
.content{
    padding:20px;
}

/* LABELS */
label{
    font-weight:bold;
    margin-top:12px;
    margin-bottom:5px;
}

/* INPUTS */
.form-control{
    border-radius:12px;
    padding:12px;
    border:1px solid #ddd;
}

/* BOTÓN */
.btn-save{
    width:100%;
    border:none;
    background:#1a523c;
    color:white;
    padding:14px;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    margin-top:20px;
}

.btn-save:hover{
    background:#1a523c;
}

/* VOLVER */
.btn-back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#1a523c;
    text-decoration:none;
    font-size:15px;
}

/* FLOAT BUTTON */
.btn-float{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#1a523c;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    text-decoration:none;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
<i class="fa-solid fa-pen-to-square"></i>
Editar Compra
</div>

<div class="container-edit">

<div class="card-edit">

<!-- IMAGEN -->
<img src="/uploads/{{ compra[5] }}">

<div class="content">

<form method="POST"
      action="/actualizar/{{ compra[0] }}"
      enctype="multipart/form-data">

<label>Producto</label>
<input type="text"
       name="producto"
       class="form-control"
       value="{{ compra[1] }}"
       required>

<label>Proveedor</label>
<input type="text"
       name="proveedor"
       class="form-control"
       value="{{ compra[2] }}"
       required>

<label>Monto</label>
<input type="number"
       name="monto"
       class="form-control"
       value="{{ compra[3] }}"
       required>

<label>Cambiar imagen</label>
<input type="file"
       name="foto"
       class="form-control">

<button type="submit" class="btn-save">
Guardar cambios
</button>

</form>

<a href="/historial" class="btn-back">
← Volver al historial
</a>

</div>

</div>

</div>

<!-- FLOAT -->
<a href="/historial" class="btn-float">
<i class="fa-solid fa-list"></i>
</a>

</body>
</html>
