<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Crear Cuenta</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
    background: linear-gradient(135deg, #f4f6f9, #dceee4);
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

.register-card{
    width: 100%;
    max-width: 420px;
    border: none;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.header{
    background-color: #1a523c;
    color: white;
    text-align: center;
    padding: 25px;
}

.header i{
    font-size: 45px;
    margin-bottom: 10px;
}

.form-control{
    border-radius: 12px;
    padding: 12px;
}

.btn-register{
    background-color: #1a523c;
    color: white;
    border-radius: 12px;
    padding: 12px;
    font-weight: bold;
    transition: 0.3s;
}

.btn-register:hover{
    background-color: #123a2a;
    color: white;
    transform: scale(1.02);
}

.link{
    text-decoration: none;
    color: #1a523c;
    font-weight: bold;
}

.password-rules{
    font-size: 14px;
    margin-top: 10px;
}

.valid{
    color: green;
}

.invalid{
    color: red;
}

.toggle-password{
    cursor: pointer;
    position: absolute;
    right: 15px;
    top: 42px;
    color: gray;
}

.position-relative{
    position: relative;
}

</style>

</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card register-card">

    <!-- HEADER -->
    <div class="header">

        <i class="fa-solid fa-user-plus"></i>

        <h3>Crear Cuenta</h3>

        <small>
            Registro seguro
        </small>

    </div>

    <!-- BODY -->
    <div class="card-body p-4">

        <form action="/crear_cuenta" method="POST">
    <!-- USUARIO -->
<div class="mb-3">

    <label class="form-label">
        Usuario
    </label>

    <input
        class="form-control"
        type="text"
        name="usuario"
        placeholder="Nombre de usuario"
        required>

</div>
            

            <!-- EMAIL -->
            <div class="mb-3">

                <label class="form-label">
                    Correo Gmail
                </label>

                <input
                    class="form-control"
                    type="email"
                    name="email"
                    placeholder="correo@gmail.com"
                    required>

            </div>

            <!-- PASSWORD -->
            <div class="mb-3 position-relative">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="contraseña"
                    required>

                <!-- OJO -->
                <i class="fa-solid fa-eye toggle-password"
                   id="togglePassword"></i>

            </div>

            <!-- REGLAS -->
            <div class="password-rules">

                <div id="length" class="invalid">
                    ❌ Mínimo 8 caracteres
                </div>

                <div id="uppercase" class="invalid">
                    ❌ Una letra mayúscula
                </div>

                <div id="number" class="invalid">
                    ❌ Un número
                </div>

            </div>

            <!-- BOTÓN -->
            <button type="submit" class="btn btn-register w-100 mt-4">
            <i class="fa-solid fa-check"></i>
            Crear Cuenta


            </button>

        </form>

        <!-- LOGIN -->
        <div class="text-center mt-4">

            <a href="/" class="link">

                <i class="fa-solid fa-arrow-left"></i>

                Volver al login

            </a>

        </div>

    </div>

</div>

<!-- VALIDACIÓN PASSWORD -->
<script>

const password = document.getElementById('password');

const length = document.getElementById('length');
const uppercase = document.getElementById('uppercase');
const number = document.getElementById('number');

password.addEventListener('keyup', () => {

    const value = password.value;

    // 8 caracteres
    if(value.length >= 8){

        length.classList.remove('invalid');
        length.classList.add('valid');

        length.innerHTML = '✅ Mínimo 8 caracteres';

    } else {

        length.classList.remove('valid');
        length.classList.add('invalid');

        length.innerHTML = '❌ Mínimo 8 caracteres';

    }

    // mayúscula
    if(/[A-Z]/.test(value)){

        uppercase.classList.remove('invalid');
        uppercase.classList.add('valid');

        uppercase.innerHTML = '✅ Una letra mayúscula';

    } else {

        uppercase.classList.remove('valid');
        uppercase.classList.add('invalid');

        uppercase.innerHTML = '❌ Una letra mayúscula';

    }

    // número
    if(/[0-9]/.test(value)){

        number.classList.remove('invalid');
        number.classList.add('valid');

        number.innerHTML = '✅ Un número';

    } else {

        number.classList.remove('valid');
        number.classList.add('invalid');

        number.innerHTML = '❌ Un número';

    }

});


// MOSTRAR PASSWORD
const togglePassword = document.getElementById('togglePassword');

togglePassword.addEventListener('click', () => {

    const type = password.getAttribute('type') === 'password'
        ? 'text'
        : 'password';

    password.setAttribute('type', type);

    togglePassword.classList.toggle('fa-eye');
    togglePassword.classList.toggle('fa-eye-slash');

});

</script>

</body>
</html>
