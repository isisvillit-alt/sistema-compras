<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Control Compras - Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    background:linear-gradient(135deg, #f4f6f9, #dceee4);

}

/* CARD */
.login-card{

    width:100%;
    max-width:420px;

    background:white;

    border-radius:25px;

    padding:40px;

    box-shadow:0 8px 30px rgba(0,0,0,0.1);

}

/* LOGO */
.logo{

    width:90px;
    height:90px;

    background:#1a523c;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:auto;
    margin-bottom:20px;

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

}

.logo i{
    font-size:40px;
    color:white;
}

/* TITULO */
.title{
    text-align:center;
    margin-bottom:30px;
}

.title h2{
    font-weight:bold;
    color:#1a523c;
}

.title p{
    color:gray;
    font-size:14px;
}

/* INPUTS */
.form-label{
    color:#1a523c;
    font-weight:bold;
}

.form-control{

    border-radius:14px;

    padding:14px;

    border:1px solid #ccc;

}

.form-control:focus{

    box-shadow:none;

    border:1px solid #1a523c;

}

/* PASSWORD */
.password-container{
    position:relative;
}

.toggle-password{

    position:absolute;

    top:50px;
    right:15px;

    cursor:pointer;

    color:gray;
}

/* BOTON */
.btn-login{

    background:#1a523c;

    color:white;

    border:none;

    border-radius:14px;

    padding:14px;

    font-weight:bold;

    transition:0.3s;
}

.btn-login:hover{

    background:#123a2a;

    color:white;

    transform:translateY(-2px);

}

/* LINKS */
.links{
    text-align:center;
    margin-top:25px;
}

.links a{

    color:#1a523c;

    text-decoration:none;

    display:block;

    margin-top:10px;

    font-weight:bold;

    transition:0.3s;
}

.links a:hover{
    color:#123a2a;
}

/* FOOTER */
.footer{

    text-align:center;

    margin-top:25px;

    font-size:13px;

    color:gray;
}

</style>

</head>

<body>

<div class="login-card">

    <!-- LOGO -->
    <div class="logo">

        <i class="fa-solid fa-cart-shopping"></i>

    </div>

    <!-- TITLE -->
    <div class="title">

        <h2>
            Control Compras
        </h2>

        <p>
            Sistema profesional de gestión
        </p>

    </div>

    <!-- FORM -->
    <form action="/validar" method="POST">

        <!-- EMAIL -->
        <div class="mb-3">

            <label class="form-label">

                Correo Gmail

            </label>

            <input
                class="form-control"
                type="email"
                name="usuario"
                placeholder="correo@gmail.com"
                required>

        </div>

        <!-- PASSWORD -->
        <div class="mb-3 password-container">

            <label class="form-label">

                Contraseña

            </label>

            <input
                class="form-control"
                type="password"
                id="password"
                name="password"
                placeholder="********"
                required>

            <i class="fa-solid fa-eye toggle-password"
               id="togglePassword"></i>

        </div>

        <!-- BUTTON -->
        <button class="btn btn-login w-100">

            <i class="fa-solid fa-right-to-bracket"></i>

            Ingresar

        </button>

    </form>

    <!-- LINKS -->
    <div class="links">

        <a href="/registro">

            <i class="fa-solid fa-user-plus"></i>

            Crear cuenta

        </a>

        <a href="/recuperar">

            <i class="fa-solid fa-key"></i>

            ¿Olvidaste tu contraseña?

        </a>

    </div>

    <!-- FOOTER -->
    <div class="footer">

        © 2026 Control Compras

    </div>

</div>

<!-- MOSTRAR PASSWORD -->
<script>

const togglePassword =
document.getElementById('togglePassword');

const password =
document.getElementById('password');

togglePassword.addEventListener('click', () => {

    const type =
    password.getAttribute('type') === 'password'
    ? 'text'
    : 'password';

    password.setAttribute('type', type);

    togglePassword.classList.toggle('fa-eye');
    togglePassword.classList.toggle('fa-eye-slash');

});

</script>

</body>
</html>
