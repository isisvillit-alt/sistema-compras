<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Historial</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='historial.css'
        ) }}"
    >
</head>

<body>

    <header class="top-header">

        <div class="header-icon">
            <i class="fa-solid fa-cart-shopping"></i>
        </div>

        <h1>Historial de compras</h1>

        <p>
            Consulta tus compras por mes y día
        </p>

    </header>

    <main class="page">

        <nav class="toolbar">

            <a
                href="{{ url_for('compras') }}"
                class="new-button"
            >
                <i class="fa-solid fa-plus"></i>
                Nueva
            </a>

            <a
                href="{{ url_for('papelera') }}"
                class="trash-button"
            >
                <i class="fa-solid fa-trash"></i>
                Papelera
            </a>

        </nav>

        <section class="card-box">

            <a
                href="{{ url_for(
                    'historial_meses'
                ) }}"
                class="purchase-summary"
            >

                <div class="summary-circle">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>

                <div class="summary-label">
                    Compras
                </div>

                <div class="summary-number">
                    {{ total_compras }}
                </div>

                <div class="mt-2 text-success fw-bold">
                    Abrir carpetas de meses
                    <i class="fa-solid fa-chevron-right"></i>
                </div>

            </a>

        </section>

        <section class="card-box search-panel">

            <h2>
                <i class="fa-solid fa-magnifying-glass"></i>
                Buscar compra
            </h2>

            <form
                action="{{ url_for(
                    'historial_buscar'
                ) }}"
                method="GET"
            >

                <div class="mb-3">

                    <label>
                        Producto, proveedor o cliente
                    </label>

                    <input
                        type="search"
                        name="q"
                        class="form-control"
                        placeholder="Ej. Manzana, Julia..."
                    >

                </div>

                <div class="mb-3">

                    <label>
                        Día de la compra
                    </label>

                    <input
                        type="date"
                        name="fecha"
                        class="form-control"
                    >

                </div>

                <button
                    type="submit"
                    class="search-button"
                >
                    <i class="fa-solid fa-search"></i>
                    Buscar
                </button>

            </form>

        </section>

    </main>

</body>
</html>
