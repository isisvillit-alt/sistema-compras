<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Recuperar contraseña</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
    font-family:Arial;
}

.card{
    width:100%;
    max-width:400px;
    border:none;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.btn-success{
    background:#1a523c;
    border:none;
    border-radius:12px;
    padding:12px;
}

</style>

</head>

<body>

<div class="card">

    <h3 class="text-center mb-4">

        Recuperar contraseña

    </h3>

    <form method="POST">

        <input
            class="form-control mb-3"
            type="email"
            name="email"
            placeholder="correo@gmail.com"
            required>

        <button class="btn btn-success w-100">

            Enviar correo

        </button>

    </form>

    <div class="text-center mt-3">

        <a href="/">
            Volver al login
        </a>

    </div>

</div>

</body>
</html>
